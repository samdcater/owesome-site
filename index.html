<style>
:root{--bg:#07070c;--text:#f4f3fa;--muted:#9c9ab4;--a:#6c55e0;--b:#8f7cff;--line:#262633}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;position:relative}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.g1{width:520px;height:520px;background:#6c55e0;opacity:.35;top:-160px;left:-140px;animation:drift 14s ease-in-out infinite alternate}
.g2{width:460px;height:460px;background:#c34fd8;opacity:.22;bottom:-180px;right:-120px;animation:drift 17s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}
main{flex:1;display:grid;place-items:center;text-align:center;padding:48px 22px;position:relative;z-index:1}
.logo{width:clamp(240px,58vw,400px);height:auto;margin-bottom:18px;filter:drop-shadow(0 0 60px rgba(143,124,255,.55));animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.96);filter:drop-shadow(0 0 40px rgba(143,124,255,.35))}50%{transform:scale(1.05);filter:drop-shadow(0 0 85px rgba(190,120,255,.8))}}
h1{font-size:clamp(16px,3.6vw,24px);line-height:1.35;letter-spacing:.01em;font-weight:600}
h1 span{display:block;padding-bottom:.1em;background:linear-gradient(90deg,var(--b),#e07bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:clamp(16px,2.6vw,20px);margin:22px auto 30px;max-width:460px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:rgba(20,20,28,.7);border:1px solid var(--line);backdrop-filter:blur(8px);font-weight:600;font-size:15px;color:#d9d6f2;letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--b);box-shadow:0 0 0 0 rgba(143,124,255,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(143,124,255,0)}100%{box-shadow:0 0 0 0 rgba(143,124,255,0)}}
footer{position:relative;z-index:1;padding:26px 22px 34px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;align-items:center;}
footer .links{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
